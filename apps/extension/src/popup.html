<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Roll Together</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="popupBody">
    <main class="container">
      <h1>Roll Together</h1>

      <section id="loadingPanel" class="panel panelLoading">
        <span class="spinner" aria-hidden="true"></span>
        <p>Connecting&hellip;</p>
      </section>

      <section id="disconnectedPanel" class="panel" hidden>
        <p class="description">
          Create a room to watch Crunchyroll in sync with your friends.
        </p>
        <div class="buttonRow buttonRowBottom">
          <button id="createRoom" class="button buttonPrimary" type="button">
            Create room
          </button>
        </div>
      </section>

      <section id="connectedPanel" class="panel" hidden>
        <p class="description">
          Share this link to invite others to watch in sync with you.
        </p>
        <input id="inviteUrl" class="inviteUrl" type="text" readonly />

        <div class="rosterHeading">
          <span>Watching now</span>
          <span id="memberCount"></span>
        </div>
        <ul id="memberList" class="memberList"></ul>

        <div class="buttonRow buttonRowBottom">
          <button id="copyUrl" class="button buttonPrimary" type="button">
            Copy URL
          </button>
          <button id="disconnect" class="button buttonSecondary" type="button">
            Disconnect
          </button>
        </div>
      </section>

      <section id="errorPanel" class="panel" hidden>
        <p id="errorMessage" class="description descriptionError"></p>
        <div class="buttonRow buttonRowBottom">
          <button id="retry" class="button buttonPrimary" type="button">
            Try again
          </button>
        </div>
      </section>

      <p
        id="liveStatus"
        class="visuallyHidden"
        role="status"
        aria-live="polite"
      ></p>

      <footer class="footer">
        <button id="openOptions" class="footerLink" type="button">
          Edit username
        </button>
        <a
          class="footerLink repoLink"
          href="https://github.com/w4r6/roll_together"
          target="_blank"
          rel="noopener noreferrer"
        >
          <svg
            class="githubLogo"
            viewBox="0 0 16 16"
            aria-hidden="true"
            focusable="false"
          >
            <path
              d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82A7.65 7.65 0 0 1 8 3.86c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"
            />
          </svg>
          <span>Star the repo</span>
        </a>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
