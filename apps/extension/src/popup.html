<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Roll Together</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="popup-body">
    <main class="popup-shell">
      <header class="brand-lockup">
        <span class="brand-mark" aria-hidden="true">RT</span>
        <span>
          <strong>Roll Together</strong>
          <small>Crunchyroll, in sync</small>
        </span>
      </header>

      <section
        id="loadingPanel"
        class="panel panel-loading"
        aria-label="Connecting"
      >
        <span class="loader" aria-hidden="true"></span>
        <p>Checking this screening room&hellip;</p>
      </section>

      <section id="disconnectedPanel" class="panel" hidden>
        <p class="eyebrow">Private watch room</p>
        <h1>Ready when you are.</h1>
        <p class="supporting-copy">
          Start a room, then send the invite link to the people watching with
          you.
        </p>
        <button id="createRoom" class="button button-primary" type="button">
          Create room
        </button>
      </section>

      <section id="connectedPanel" class="panel" hidden>
        <p class="eyebrow">Watch room</p>
        <h1>Room</h1>
        <section class="room-roster" aria-labelledby="rosterTitle">
          <div class="roster-heading">
            <h2 id="rosterTitle">Watching now</h2>
            <span id="memberCount" class="member-count"></span>
          </div>
          <ul id="memberList" class="member-list"></ul>
        </section>
        <div class="button-stack">
          <button id="copyUrl" class="button button-primary" type="button">
            Copy invite link
          </button>
          <button id="disconnect" class="button button-quiet" type="button">
            Disconnect
          </button>
        </div>
      </section>

      <section id="errorPanel" class="panel" hidden>
        <p class="eyebrow eyebrow-error">Connection issue</p>
        <h1>We lost the thread.</h1>
        <p id="errorMessage" class="supporting-copy"></p>
        <button id="retry" class="button button-primary" type="button">
          Try again
        </button>
      </section>

      <p
        id="liveStatus"
        class="visually-hidden"
        role="status"
        aria-live="polite"
      ></p>

      <footer class="popup-footer">
        <button id="openOptions" class="footer-link" type="button">
          Edit username
        </button>
        <a
          href="https://github.com/w4r6/roll_together"
          target="_blank"
          rel="noopener noreferrer"
        >
          View source <span aria-hidden="true">↗</span>
        </a>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
