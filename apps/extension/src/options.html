<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Roll Together Options</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="optionsBody">
    <main class="optionsContainer">
      <h1>Roll Together Options</h1>

      <form id="profileForm" class="field">
        <label class="fieldLabel" for="usernameInput">Username</label>
        <p class="fieldHint">
          This is the name other people see in the rooms you join.
        </p>
        <input
          id="usernameInput"
          class="textInput"
          type="text"
          maxlength="24"
          autocomplete="nickname"
          spellcheck="false"
          required
        />
        <div class="buttonRow">
          <button class="button buttonPrimary" type="submit">Save</button>
        </div>
      </form>

      <p
        id="profileStatus"
        class="formStatus"
        role="status"
        aria-live="polite"
      ></p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
