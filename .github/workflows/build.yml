name: Build Cross-Browser Extension

on:
  push:
    branches: [ main ]
    # Note: path filters are not evaluated for tag pushes, so `v*` tags
    # always trigger this workflow (and the release job) regardless of paths-ignore.
    tags: [ 'v*' ]
    paths-ignore:
      - 'apps/backend/**'
      - '.do/**'
      - '.github/workflows/backend-build.yml'
      - '.github/workflows/deploy-digitalocean.yml'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'apps/backend/**'
      - '.do/**'
      - '.github/workflows/backend-build.yml'
      - '.github/workflows/deploy-digitalocean.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chrome, firefox]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: package-lock.json
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build ${{ matrix.browser }} extension
      run: npm run build:production:${{ matrix.browser }}
    
    - name: Package ${{ matrix.browser }} extension
      run: npm run package:${{ matrix.browser }}

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: rolltogether-${{ matrix.browser }}
        path: apps/extension/build${{ matrix.browser == 'firefox' && '-firefox' || '' }}

    - name: Upload package artifact
      uses: actions/upload-artifact@v4
      with:
        name: rolltogether-${{ matrix.browser }}-zip
        path: apps/extension/rolltogether-${{ matrix.browser }}.zip

  release:
    needs: package
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_type == 'tag'
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Verify tag matches manifest version
      run: |
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        MANIFEST_VERSION=$(node -p "require('./apps/extension/manifest.json').version")
        if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
          echo "::error::Tag $GITHUB_REF_NAME (version $TAG_VERSION) does not match apps/extension/manifest.json version $MANIFEST_VERSION"
          exit 1
        fi
        echo "Tag $GITHUB_REF_NAME matches manifest version $MANIFEST_VERSION"
    
    - name: Download Chrome package
      uses: actions/download-artifact@v4
      with:
        name: rolltogether-chrome-zip
        path: ./
    
    - name: Download Firefox package
      uses: actions/download-artifact@v4
      with:
        name: rolltogether-firefox-zip
        path: ./
    
    - name: Extract version from manifest
      id: get_version
      run: |
        VERSION=$(grep -Po '"version": "\K[^"]*' apps/extension/manifest.json)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Found version: $VERSION"
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: "Roll Together v${{ steps.get_version.outputs.version }}"
        body: |
          ## Roll Together Extension v${{ steps.get_version.outputs.version }}
          
          ### Downloads
          - **Chrome Extension**: `rolltogether-chrome.zip`
          - **Firefox Extension**: `rolltogether-firefox.zip`
          
          ### Installation
          1. Download the appropriate zip file for your browser
          2. Extract the contents
          3. Load the extension in developer mode
          
          For detailed installation instructions, see the [README](https://github.com/${{ github.repository }}/blob/main/README.md).
        files: |
          rolltogether-chrome.zip
          rolltogether-firefox.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
